<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flow Recorder Demo Shop</title><style>body{font:18px system-ui;background:#eff4fa;color:#16243b;max-width:760px;margin:60px auto;padding:24px}main{background:white;border-radius:20px;padding:36px;box-shadow:0 12px 60px #20345515}label{display:block;margin:20px 0}input,select,button{font:inherit;padding:12px;border:1px solid #ccd5e4;border-radius:8px}button{background:#225ddb;color:white;cursor:pointer}p{line-height:1.6}#notice{min-height:32px;color:#187141}</style><main><p>UI FLOW RECORDER / DEMO</p><h1>A small checkout journey</h1><p>Start recording from the extension, fill the form, and add an item. Use fictional data.</p><label>Your demo name <input id="customer" data-testid="customer-name" autocomplete="off"></label><label>Notebook color <select id="color"><option>Ocean blue</option><option>Forest green</option></select></label><label><input id="gift" type="checkbox"> Gift wrap</label><button id="add" data-testid="add-to-cart">Add to cart</button><button id="checkout">Checkout</button><p id="notice" role="status"></p><a href="/complete">Finish and navigate</a></main><script>document.querySelector('#add').onclick=()=>document.querySelector('#notice').textContent='Notebook added to your cart';document.querySelector('#checkout').onclick=()=>{history.pushState({},'', '/checkout');document.querySelector('#notice').textContent='Checkout ready. Stop recording, then open the viewer.'};</script></html>
