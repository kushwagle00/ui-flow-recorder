<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UI Flow Recorder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>UI Flow Recorder</h1>
      
      <div id="status">
        <span>Status:&nbsp;</span>
        <span id="statusText">Idle</span>
      </div>
      
      <div id="runInfo">
        <strong>Run:</strong> <span id="runId">—</span>
        <br />
        <strong>Steps:</strong> <span id="stepCount">0</span>
      </div>

      <div class="actions">
        <button id="startBtn">▶ Start Recording</button>
        <button id="stopBtn" disabled>⏹ Stop Recording</button>
        <button id="openViewerBtn">👁 Open Viewer</button>
      </div>

      <small class="hint">Captures clicks, form inputs, navigation, and screenshots</small>
    </div>

    <!-- IMPORTANT: external file, no inline JS -->
    <script src="popup.js"></script>
  </body>
</html>
