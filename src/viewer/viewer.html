<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UI Flow Viewer</title>
    <link rel="stylesheet" href="viewer.css" />
    <!-- Option A: put script in head with defer so it runs after DOM is parsed -->
    <script src="viewer.js" defer></script>
  </head>
  <body>
    <header class="header">
      <h1>UI Flow Viewer</h1>
      <div class="toolbar">
        <button id="playBtn">▶ Play</button>
        <button id="exportBtn">Export JSON</button>
        <button id="viewJsonBtn">View JSON</button>
        <button id="importBtn" disabled>Import JSON</button>
        <button id="deleteBtn" style="color: #ef4444;">🗑 Delete</button>
        <button id="saveBtn" class="primary">Save Changes</button>
        <input id="importFileInput" type="file" accept="application/json" hidden />
      </div>
    </header>

    <main class="layout">
      <aside class="runs-panel">
        <div class="runs-header">
          <span>Recordings</span>
        </div>
        <ul id="runsList" class="runs-list"></ul>
      </aside>

      <aside class="steps">
        <div class="steps-header">
          <span>Steps</span>
          <span id="count" class="count">0</span>
        </div>
        <ul id="stepList" class="step-list"></ul>
      </aside>

      <section class="detail">
        <div class="detail-top">
          <div class="img-wrap">
            <p id="imagePlaceholder" class="hint">Select a recorded step to inspect it.</p>
            <img id="screenshot" alt="Step screenshot" />
            <!-- Pointer overlay -->
            <div id="pointer" class="pointer" hidden></div>
          </div>
          <div class="meta">
            <div><strong>Type:</strong> <span id="stepType">—</span></div>
            <div><strong>URL:</strong> <span id="stepUrl" class="mono">—</span></div>
            <div><strong>Timestamp:</strong> <span id="stepTime">—</span></div>
            <div><strong>Viewport:</strong> <span id="viewport">—</span></div>
          </div>
        </div>

        <div class="selectors">
          <h2>Selectors</h2>
          <form id="selectorForm" class="selector-form"></form>
          <small class="hint">
            Pick a primary selector. Alternatives remain as fallbacks.
          </small>
        </div>

        <div class="nav">
          <button id="prevBtn">← Prev</button>
          <div class="playback-info" id="playbackInfo" hidden>
            <span id="playbackStatus">Playing: 1/10</span>
            <button id="pausePlayBtn" style="margin-left: 8px;">⏸ Pause</button>
          </div>
          <button id="nextBtn">Next →</button>
        </div>
      </section>
    </main>
  </body>
</html>
